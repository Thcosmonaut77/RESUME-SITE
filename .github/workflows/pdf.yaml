name: Build Resume PDF

on:
  push:
    branches:
      - main   # or your default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate Resume PDF
        run: node export-pdf.js

      - name: Commit Resume PDF back to Repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add resume.pdf
          git commit -m "Update resume.pdf [skip ci]" || echo "No changes"
          git push

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: resume-latest
          name: Latest Resume
          body: "Automatically generated resume PDF"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Resume PDF to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: resume-latest
          files: Ibrahim Sulyman - Cloud & DevOps Engineer - Resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
